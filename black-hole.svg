<svg width="900" height="500" viewBox="0 0 900 500"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="space">
      <stop offset="0" stop-color="#020005"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>

    <radialGradient id="disk">
      <stop offset="0%"   stop-color="#000"/>
      <stop offset="45%"  stop-color="#050505"/>
      <stop offset="58%"  stop-color="#ff2200"/>
      <stop offset="68%"  stop-color="#ff8c00"/>
      <stop offset="76%"  stop-color="#ffe066"/>
      <stop offset="84%"  stop-color="#ff4500" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Space -->
  <rect width="900" height="500" fill="url(#space)"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="80"  cy="80"  r="1.5"/>
    <circle cx="160" cy="350" r="1"/>
    <circle cx="240" cy="100" r="1"/>
    <circle cx="330" cy="420" r="1.5"/>
    <circle cx="470" cy="70"  r="1"/>
    <circle cx="580" cy="390" r="1"/>
    <circle cx="700" cy="100" r="1.5"/>
    <circle cx="810" cy="330" r="1"/>
    <circle cx="850" cy="170" r="1.5"/>
    <circle cx="120" cy="220" r="1"/>
    <circle cx="760" cy="420" r="1"/>
  </g>

  <!-- Glowing accretion disk -->
  <ellipse
    cx="450" cy="250"
    rx="330" ry="105"
    fill="none"
    stroke="#ff3300"
    stroke-width="35"
    opacity=".25"
    filter="url(#glow)">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 450 250"
      to="360 450 250"
      dur="8s"
      repeatCount="indefinite"/>
  </ellipse>

  <!-- Accretion disk -->
  <ellipse
    cx="450" cy="250"
    rx="300" ry="90"
    fill="url(#disk)"
    opacity=".95">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 450 250"
      to="360 450 250"
      dur="6s"
      repeatCount="indefinite"/>
  </ellipse>

  <!-- Black hole -->
  <circle cx="450" cy="250" r="95" fill="#000"/>

  <!-- Event horizon glow -->
  <circle
    cx="450" cy="250"
    r="105"
    fill="none"
    stroke="#ff8c00"
    stroke-width="5"
    opacity=".7"
    filter="url(#smallGlow)"
  />

  <!-- Inner shadow -->
  <circle cx="450" cy="250" r="85" fill="#000"/>

  <!-- Light particles -->
  <g fill="#ffd27a">
    <circle cx="180" cy="245" r="3">
      <animate attributeName="cx"
        values="180;720;180"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="720" cy="260" r="2">
      <animate attributeName="cx"
        values="720;180;720"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
